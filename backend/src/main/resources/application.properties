spring.application.name=file-storage

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/file_storage}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
file-storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:52428800}
file-storage.allowed-content-types=application/pdf,image/png,image/jpeg,text/plain,application/zip,application/x-zip-compressed

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
